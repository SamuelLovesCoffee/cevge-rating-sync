name: Build CEVGE FIDE cache

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 2 * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_cache.py"
      - ".github/workflows/update-ratings-cache.yml"

permissions:
  contents: write

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build rating cache
        run: python scripts/build_cache.py

      - name: Commit cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cevge-ratings.csv
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update CEVGE FIDE rating cache"
            git push
          fi
