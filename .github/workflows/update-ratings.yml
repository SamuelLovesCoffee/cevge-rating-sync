name: Update CEVGE member ratings

on:
  schedule:
    - cron: "15 5 2 * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and compare data without writing to Google Sheets"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update member ratings
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          MEMBERS_TAB: "Membres"
          RATINGS_TAB: "Ratings_Current"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python sync_ratings.py
